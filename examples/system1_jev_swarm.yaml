# System 1 decision swarm — Jev (TypeSafe hosted API)
# Requires: TYPESAFE_API_KEY environment variable
# Run: maestro run examples/system1_jev_swarm.yaml "Customer says: I was charged twice for my subscription. Please refund one charge today or I'll cancel."

name: system1-jev-triage
description: Jev System 1 decision model for customer support triage (hosted API)
topology: system1

agents:
  - name: triage
    type: jev
    role: decision-model
    description: Jev — TypeSafe hosted System 1 decision API
    model: "jev-latest"  # "jev-latest", "jev-1.13.0", "jev-preview"
    base_url: "https://api.typesafe.ai"
    # api_key: from TYPESAFE_API_KEY env var
    questions:
      department:
        type: choice
        instructions: "Which department should handle this request?"
        criteria:
          billing: "invoices, payments, refunds"
          technical: "bugs, outages, system errors"
          sales: "pricing, new contracts"
          other: "everything else"
      urgency:
        type: score
        instructions: "How urgent is this request?"
        criteria: ["not urgent", "soon", "critical deadline or blocking issue"]
      churn_risk:
        type: noul
        instructions: "Does the user threaten to cancel or leave?"
      refund_requested:
        type: noul
        instructions: "Does the user explicitly request a refund?"