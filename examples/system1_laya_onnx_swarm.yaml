# System 1 decision swarm — Laya ONNX (local ONNX Runtime)
# Run: maestro run examples/system1_laya_onnx_swarm.yaml "Customer says: My payment failed twice. Please refund the duplicate charge."

name: system1-laya-onnx-triage
description: Laya ONNX System 1 decision model for customer support triage (CPU-optimized)
topology: system1

agents:
  - name: triage
    type: laya-onnx
    role: decision-model
    description: Laya ONNX — fast CPU-optimized System 1 decisions
    model_id: "convaiinnovations/laya"
    onnx_path: "laya.onnx"
    subfolder: "english"  # or "multilingual", "typed-decisions"
    questions:
      department:
        type: choice
        instructions: "Which department should handle this request?"
        criteria:
          billing: "invoices, payments, refunds"
          technical: "bugs, outages, system errors"
          sales: "pricing, new contracts"
          other: "everything else"
      urgency:
        type: score
        instructions: "How urgent is this request?"
        criteria: ["not urgent", "soon", "critical deadline or blocking issue"]
      churn_risk:
        type: noul
        instructions: "Does the user threaten to cancel or leave?"