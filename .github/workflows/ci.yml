name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dev dependencies
        # ruff is pinned exactly in the [dev] extra, and must stay that way:
        # unpinned means the rule set is whatever the newest release defaults
        # to. Ruff 0.16.0 widened its built-in defaults and turned a sibling
        # project's CI red with 89 findings in code that had not changed.
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src/ tests/

      - name: Ruff format check
        run: ruff format --check src/ tests/

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # MAESTRO is developed on Windows and its transport, subprocess and
        # path handling differ there, so Windows is a first-class CI target
        # rather than an afterthought. macOS catches the same class of bug
        # from the other direction.
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # No API keys: the whole suite runs offline on the deterministic `echo`
      # backend, and provider transports are faked. Adding credentials here
      # would only mask a regression in that guarantee.
      - name: Run tests
        run: pytest tests/ --tb=short -q

  zero-deps:
    name: Zero required dependencies
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The core runtime being pure standard library is a design constraint,
      # not an accident — so it is enforced here rather than trusted. This job
      # installs the package with NO extras and asserts that nothing
      # third-party came with it, then exercises the real entry points.
      - name: Install with no extras
        run: pip install .

      - name: Assert nothing third-party was installed
        shell: python
        run: |
          import json, subprocess, sys
          frozen = subprocess.run(
              [sys.executable, "-m", "pip", "list", "--format=json",
               "--exclude", "pip", "--exclude", "setuptools", "--exclude", "wheel"],
              capture_output=True, text=True, check=True,
          ).stdout
          installed = {p["name"].lower() for p in json.loads(frozen)}
          installed.discard("maestro-swarm")
          assert not installed, f"maestro-swarm pulled in dependencies: {sorted(installed)}"
          print("clean: maestro-swarm installed with zero third-party packages")

      # Every command here must exit 0 with no network and no keys. The demo
      # runs a full supervisor->workers->synthesis swarm on the offline `echo`
      # backend, so this exercises streaming and the usage rollup for real,
      # not just the import.
      - name: Import and run the real entry points
        run: |
          python -c "import maestro; print('maestro', maestro.__version__)"
          maestro version
          maestro topologies
          maestro providers
          maestro prices
          maestro demo --usage --no-trace
          maestro demo --stream --no-trace
          maestro validate examples/local_ollama_swarm.json

      - name: A YAML spec must fail with a clear message, not a traceback
        shell: python
        run: |
          import subprocess, sys
          # PyYAML is an optional extra. Without it, a .yaml spec must explain
          # itself and point at the fix — never crash with an ImportError.
          out = subprocess.run(
              [sys.executable, "-m", "maestro", "validate", "examples/research_swarm.yaml"],
              capture_output=True, text=True,
          )
          combined = out.stdout + out.stderr
          assert "PyYAML" in combined, combined
          assert "Traceback" not in combined, combined
          print("graceful:", out.stdout.strip())
